name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check-test-build:
    name: check / test / build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: moon version --all

      - name: Type check (warnings are errors)
        run: moon check --deny-warn

      - name: Unit tests
        run: moon test

      - name: Build CLI (js)
        run: moon build --target js

      - name: Build library (wasm)
        run: moon build --target wasm

      - name: Build library (wasm-gc)
        run: moon build --target wasm-gc

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # The codec tables in CPython are part of the generator's input, so
          # the version is pinned: a different interpreter can emit a different
          # table and turn the reproducibility check into a false alarm.
          python-version: '3.12'

      - name: Regenerated tables are up to date
        run: |
          python scripts/gen_tables.py
          git diff --exit-code -- src/mojibake/tables_gen.mbt

      - name: Cross-check against CPython codecs
        run: python scripts/e2e_check.py

      - name: Exhaustive byte-space check
        run: python scripts/space_check.py

      - name: CLI smoke test
        run: |
          CLI=_build/js/debug/build/cmd/moonmojibake/moonmojibake.js
          node $CLI detect samples/gbk.txt | tee /tmp/detect.txt
          grep -q "guess: gbk" /tmp/detect.txt
          node $CLI repair samples/moji_latin1.txt | tee /tmp/repair.txt
          grep -q "latin1 -> utf-8" /tmp/repair.txt

      - name: Tree repair is idempotent
        run: |
          CLI=_build/js/debug/build/cmd/moonmojibake/moonmojibake.js
          cp -r samples /tmp/tree
          node $CLI fix /tmp/tree --json > /tmp/dry.json
          node $CLI fix /tmp/tree --write --json > /tmp/wet.json
          node $CLI fix /tmp/tree --json > /tmp/again.json
          python -c "import json; d=json.load(open('/tmp/dry.json')); assert d['changed']==7 and d['written']==0, d"
          python -c "import json; d=json.load(open('/tmp/wet.json')); assert d['written']==d['changed']==7, d"
          python -c "import json; d=json.load(open('/tmp/again.json')); assert d['changed']==0, d"
          # Every rewritten file must be readable as UTF-8, which is the whole point.
          python -c "import glob; [open(p, encoding='utf-8').read() for p in glob.glob('/tmp/tree/*')]"

      - name: The UTF-8 gate fails when it should
        run: |
          CLI=_build/js/debug/build/cmd/moonmojibake/moonmojibake.js
          mkdir -p /tmp/utf8only && cp samples/utf8.txt /tmp/utf8only/
          node $CLI scan /tmp/utf8only --fail-if-not utf-8
          set +e
          node $CLI scan samples --fail-if-not utf-8 > /dev/null
          tree_code=$?
          node $CLI detect samples/gbk.txt --fail-if-not utf-8 > /dev/null
          file_code=$?
          node $CLI detect samples/utf8.txt --fail-if-not utf-8 > /dev/null
          ok_code=$?
          set -e
          test "$tree_code" -eq 2
          test "$file_code" -eq 2
          test "$ok_code" -eq 0
